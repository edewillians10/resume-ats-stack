- name: Check OS
  assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", ">=")
    fail_msg: "Ubuntu 24.04+ is required"

- name: Check CPU
  assert:
    that:
      - ansible_processor_vcpus >= 2
    fail_msg: "At least 2 vCPUs required"

- name: Check RAM
  assert:
    that:
      - ansible_memtotal_mb >= 4096
    fail_msg: "Minimum 4GB RAM required (8GB recommended)"

- name: Check disk space
  assert:
    that:
      - ansible_mounts | selectattr('mount','equalto','/') | map(attribute='size_available') | first > 20 * 1024 * 1024 * 1024
    fail_msg: "At least 20GB free disk space required"

- name: Check systemd
  command: pidof systemd
  changed_when: false

- name: Check Python version
  command: python3 --version
  register: python_version
  changed_when: false

- name: Assert Python >= 3.10
  assert:
    that:
      - python_version.stdout is search("3.1|3.2|3.3|3.4")

- name: Check required ports
  wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 1
  loop:
    - 3000
    - 11434
    - 5000

- name: Check Docker Registry reachability
  uri:
    url: https://registry-1.docker.io/v2/
    status_code:
      - 200
      - 401

- name: Remove distro Docker packages if present
  apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Docker CE and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Wait for Docker socket
  wait_for:
    path: /var/run/docker.sock
    state: present
    timeout: 60

- name: Restart Docker service
  systemd:
    name: docker
    state: restarted

- name: Wait for Docker socket after restart
  wait_for:
    path: /var/run/docker.sock
    state: present
    timeout: 60

- name: Validate Docker binary
  command: docker --version
  changed_when: false

- name: Validate Docker daemon
  command: docker info
  changed_when: false

- name: Validate Docker Compose v2
  command: docker compose version
  changed_when: false
